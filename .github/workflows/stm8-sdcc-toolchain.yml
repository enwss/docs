name: STM8 SDCC Toolchain Build

on:
  push:
    branches:
      - stm8-toolchain-build-20260806

jobs:
  package:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Install Ubuntu SDCC with STM8 backend
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y sdcc sdcc-libraries
          sdcc --version
          sdcc -mstm8 --print-search-dirs
          mkdir -p /tmp/sdcc-toolchain/bin /tmp/sdcc-toolchain/share /tmp/sdcc-toolchain/lib
          cp -a /usr/bin/sdcc /usr/bin/sdasstm8 /usr/bin/sdldstm8 /usr/bin/packihx /usr/bin/makebin /tmp/sdcc-toolchain/bin/
          cp -a /usr/share/sdcc /tmp/sdcc-toolchain/share/
          if [ -d /usr/lib/sdcc ]; then cp -a /usr/lib/sdcc /tmp/sdcc-toolchain/lib/; fi
          tar -C /tmp -czf /tmp/sdcc-toolchain-linux-x64.tar.gz sdcc-toolchain

      - name: Upload SDCC toolchain
        uses: actions/upload-artifact@v4
        with:
          name: sdcc-toolchain-linux-x64
          path: /tmp/sdcc-toolchain-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1
